<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Perhitungan Daya Turbin</title>
</head>
<body>
    <div class="dashboard-fixed">
        <div class="panel-left">
            <header>
                <h2>FLUID CONTROL</h2>
                <p>Sistem Estimasi Daya Turbin</p>
            </header>

            <div class="field">
                <label>DEBIT ALIRAN (Q)</label>
                <div class="input-row">
                    <input type="number" id="debit" value="0.00" step="0.01">
                    <span>m³/s</span>
                </div>
            </div>

            <div class="field">
                <label>HEAD TEKANAN (H)</label>
                <div class="input-row">
                    <input type="number" id="head" value="0.00" step="0.1">
                    <span>m</span>
                </div>
            </div>

            <div class="field">
                <label>EFISIENSI (η)</label>
                <div class="input-row">
                    <input type="number" id="efisiensi" value="0" step="1">
                    <span>%</span>
                </div>
            </div>

            <button class="btn-hit" onclick="calculate()">HITUNG DAYA LISTRIK</button>
            <div class="output">OUTPUT ENERGI (kW): <span id="result">0.00 kW</span></div>
        </div>

        <div class="panel-right">
            <svg id="turbine-svg" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="40" stroke="#38bdf8" stroke-width="2" fill="none"/>
                <path d="M100 30 L100 170 M30 100 L170 100" stroke="#38bdf8" stroke-width="3"/>
            </svg>
            <p id="turbine-status">TURBINE STATUS: IDLE</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
