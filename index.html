<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimasi Daya Turbin Air</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="app">
        
        <div class="form-section">
            <h1>Perhitungan Daya Turbin</h1>
            
            <div class="input-group">
                <label for="debit">Debit Air (Q)</label>
                <input type="number" id="debit" placeholder="Masukkan debit (m³/s)" step="any" required>
            </div>

            <div class="input-group">
                <label for="head">Head Turbin (m)</label>
                <input type="number" id="head" placeholder="Masukkan tinggi jatuh air (meter)" step="any" required>
            </div>

            <div class="input-group">
                <label for="efisiensi">Efisiensi Sistem (η)</label>
                <input type="number" id="efisiensi" placeholder="Masukkan efisiensi (%)" min="0" max="100" step="any" required>
            </div>

            <button onclick="calculatePower()">Hitung Daya Listrik</button>

            <div id="result-container">
                <h3>Estimasi Daya yang Dihasilkan</h3>
                <p id="result">- kW</p>
            </div>
        </div>

        <div class="visual-section">
            <div class="water-flow" id="waterFlow"></div>
            
            <svg id="turbineSVG" viewBox="0 0 100 100">
                <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none">
                    <path d="M50,50 Q50,20 65,15" />
                    <path d="M50,50 Q80,50 85,65" />
                    <path d="M50,50 Q50,80 35,85" />
                    <path d="M50,50 Q20,50 15,35" />
                    <path d="M50,50 Q71,29 80,35" />
                    <path d="M50,50 Q71,71 65,80" />
                    <path d="M50,50 Q29,71 20,65" />
                    <path d="M50,50 Q29,29 35,20" />
                </g>
                <circle cx="50" cy="50" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
                <circle cx="50" cy="50" r="4" fill="#38bdf8"/>
            </svg>
        </div>

    </div>

    <script src="/script.js"></script>
</body>
</html>
