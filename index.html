<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perhitungan Daya Turbin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <aside class="sidebar">
            <header class="header">
                <h2>FLUID CONTROL</h2>
                <p>Sistem Estimasi Daya Turbin</p>
            </header>

            <div class="input-section">
                <div class="field">
                    <label>DEBIT ALIRAN (Q)</label>
                    <div class="input-container">
                        <input type="number" id="debit" placeholder="0.00" step="0.01">
                        <span class="unit">m³/s</span>
                    </div>
                </div>

                <div class="field">
                    <label>HEAD TEKANAN (H)</label>
                    <div class="input-container">
                        <input type="number" id="head" placeholder="0.00" step="0.1">
                        <span class="unit">m</span>
                    </div>
                </div>

                <div class="field">
                    <label>EFISIENSI (η)</label>
                    <div class="input-container">
                        <input type="number" id="efisiensi" placeholder="0">
                        <span class="unit">%</span>
                    </div>
                </div>
            </div>

            <button class="calc-btn" onclick="calculatePower()">HITUNG DAYA LISTRIK</button>

            <div class="result-box">
                <small>OUTPUT ENERGI GENERATOR</small>
                <h1 id="result">0.00 kW</h1>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
