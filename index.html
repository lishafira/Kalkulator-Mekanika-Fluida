<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Perhitungan Daya Turbin</title>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <header>
                <h1>FLUID CONTROL</h1>
                <p>Sistem Estimasi Daya Turbin</p>
            </header>

            <div class="input-group">
                <label>DEBIT ALIRAN (Q)</label>
                <div class="input-field">
                    <input type="number" id="debit" placeholder="0.00" step="0.01">
                    <div class="spinner">
                        <button onclick="adjust('debit', 0.01)">▲</button>
                        <button onclick="adjust('debit', -0.01)">▼</button>
                    </div>
                    <span>m³/s</span>
                </div>
            </div>

            <div class="input-group">
                <label>HEAD TEKANAN (H)</label>
                <div class="input-field">
                    <input type="number" id="head" placeholder="0.00" step="0.1">
                    <div class="spinner">
                        <button onclick="adjust('head', 0.1)">▲</button>
                        <button onclick="adjust('head', -0.1)">▼</button>
                    </div>
                    <span>m</span>
                </div>
            </div>

            <div class="input-group">
                <label>EFISIENSI (η)</label>
                <div class="input-field">
                    <input type="number" id="efisiensi" placeholder="0" step="1">
                    <div class="spinner">
                        <button onclick="adjust('efisiensi', 1)">▲</button>
                        <button onclick="adjust('efisiensi', -1)">▼</button>
                    </div>
                    <span>%</span>
                </div>
            </div>

            <button class="btn-calc" onclick="calculate()">HITUNG DAYA LISTRIK</button>
            <div class="status-bar">OUTPUT ENERGI (kW): <span id="result">0.00 kW</span></div>
        </div>

        <div class="visualizer">
         <svg id="turbine-svg" viewBox="0 0 200 200">
            <path class="rotor" d="M100 20 L100 180 M20 100 L180 100" stroke="#38bdf8" stroke-width="6"/>
            <circle class="rotor" cx="100" cy="100" r="40" stroke="#38bdf8" stroke-width="4" fill="none"/>
            </svg>
            <p id="turbine-status">TURBINE STATUS: IDLE</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
