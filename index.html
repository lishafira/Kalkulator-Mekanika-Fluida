<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Perhitungan Daya Turbin</title>
</head>
<body>
    <div class="dashboard">
        <div class="panel-input">
            <header>
                <h2>FLUID CONTROL</h2>
                <p>Sistem Estimasi Daya Turbin</p>
            </header>

            <div class="field-container">
                <label>DEBIT ALIRAN (Q)</label>
                <div class="input-row">
                    <input type="number" id="debit" value="0.00" step="0.01">
                    <div class="spinner-btns">
                        <button onclick="adjust('debit', 0.01)">▲</button>
                        <button onclick="adjust('debit', -0.01)">▼</button>
                    </div>
                    <span class="unit">m³/s</span>
                </div>
            </div>

            <div class="field-container">
                <label>HEAD TEKANAN (H)</label>
                <div class="input-row">
                    <input type="number" id="head" value="0.00" step="0.1">
                    <div class="spinner-btns">
                        <button onclick="adjust('head', 0.1)">▲</button>
                        <button onclick="adjust('head', -0.1)">▼</button>
                    </div>
                    <span class="unit">m</span>
                </div>
            </div>

            <div class="field-container">
                <label>EFISIENSI (η)</label>
                <div class="input-row">
                    <input type="number" id="efisiensi" value="0" step="1">
                    <div class="spinner-btns">
                        <button onclick="adjust('efisiensi', 1)">▲</button>
                        <button onclick="adjust('efisiensi', -1)">▼</button>
                    </div>
                    <span class="unit">%</span>
                </div>
            </div>

            <button class="btn-hit" onclick="calculate()">HITUNG DAYA LISTRIK</button>
            <div class="output-box">OUTPUT ENERGI (kW): <span id="result">0.00 kW</span></div>
        </div>

        <div class="panel-visual">
            <svg id="turbine-svg" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-width="3"/>
                <path d="M100 20 L100 180 M20 100 L180 100" stroke="#38bdf8" stroke-width="4"/>
            </svg>
            <p id="turbine-status">TURBINE STATUS: IDLE</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
