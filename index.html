<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perhitungan Daya Turbin - Kontrol Fluida</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <div class="dashboard-container">
        
        <main class="control-panel">
            <header class="panel-header">
                <h2>FLUID CONTROL</h2>
                <p>Sistem Estimasi Daya Hidroelektrik</p>
            </header>
            
            <div class="input-group">
                <div class="input-box">
                    <label for="debit">DEBIT ALIRAN ($Q$)</label>
                    <input type="number" id="debit" placeholder="0.00" step="0.01">
                </div>
                
                <div class="input-box">
                    <label for="head">HEAD TEKANAN ($H$)</label>
                    <input type="number" id="head" placeholder="0.00" step="0.1">
                </div>
                
                <div class="input-box">
                    <label for="efisiensi">EFISIENSI SISTEM ($\eta$)</label>
                    <input type="number" id="efisiensi" placeholder="0">
                </div>
            </div>
            
            <button onclick="calculatePower()" class="btn-calculate">
                HITUNG DAYA LISTRIK
            </button>
            
            <div class="result-display">
                <p class="result-label">OUTPUT ENERGI GENERATOR</p>
                <h1 id="result" class="power-output">0.00 kW</h1>
            </div>
        </main>
        
        <section class="visual-panel">
            <div class="visual-wrapper">
                <svg id="turbineSVG" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="25" class="turbine-core" />
                    <path d="M100,75 C115,50 135,65 120,88" class="blade" />
                    <path d="M125,100 C150,115 135,135 112,120" class="blade" />
                    <path d="M100,125 C85,150 65,135 80,112" class="blade" />
                    <path d="M75,100 C50,85 65,65 88,80" class="blade" />
                </svg>
            </div>
        </section>
        
    </div>

    <script src="/script.js"></script>
</body>
</html>
