<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perhitungan Daya Turbin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <aside class="sidebar">
            <header>
                <h2>FLUID CONTROL</h2>
                <p>Sistem Estimasi Daya Turbin</p>
            </header>

            <div class="input-section">
                <div class="field">
                    <label>DEBIT ALIRAN (Q)</label>
                    <div class="input-wrapper">
                        <input type="number" id="debit" value="0.00" step="0.01">
                        <span class="unit">m³/s</span>
                        <div class="spinner">
                            <button onclick="adjust('debit', 0.01)">▲</button>
                            <button onclick="adjust('debit', -0.01)">▼</button>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label>HEAD TEKANAN (H)</label>
                    <div class="input-wrapper">
                        <input type="number" id="head" value="0.00" step="0.1">
                        <span class="unit">m</span>
                        <div class="spinner">
                            <button onclick="adjust('head', 0.1)">▲</button>
                            <button onclick="adjust('head', -0.1)">▼</button>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label>EFISIENSI (η)</label>
                    <div class="input-wrapper">
                        <input type="number" id="efisiensi" value="0" step="1">
                        <span class="unit">%</span>
                        <div class="spinner">
                            <button onclick="adjust('efisiensi', 1)">▲</button>
                            <button onclick="adjust('efisiensi', -1)">▼</button>
                        </div>
                    </div>
                </div>
            </div>

            <button class="calc-btn" onclick="calculate()">HITUNG DAYA LISTRIK</button>

            <div class="result-box">
                <small>OUTPUT ENERGI</small>
                <h1 id="result">0.00 kW</h1>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>

<section class="visual-area">
    <svg id="turbineSVG" class="turbine" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="30" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 5"/>
        <line x1="100" y1="70" x2="100" y2="130" stroke="#38bdf8" stroke-width="2"/>
        <line x1="70" y1="100" x2="130" y2="100" stroke="#38bdf8" stroke-width="2"/>
    </svg>
</section>
</html>
